<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>KadaSkill - Loading</title>
    <link rel="icon" type="image/svg+xml" href="images/loading/favicon.svg" />
    <link rel="apple-touch-icon" href="images/loading/favicon.svg" />
    <meta name="description" content="KadaSkill application loading screen" />
    <link rel="stylesheet" href="loading/globals.css" />
    <link rel="stylesheet" href="loading/styleguide.css" />
    <link rel="stylesheet" href="loading/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <main class="loading-screen" role="main">
      <section class="loading">
        <div class="authentication-page">
          <div class="icon-wrap">
            <img
              class="icon"
              src="images/loading/icon.png"
              alt="KadaSkill loading robot mascot"
              onerror="this.style.display='none';"
            />
          </div>
          <p class="text-wrapper" role="status" aria-live="polite">LOADING...</p>
        </div>
      </section>
      <header class="navigation-bar-get" aria-label="KadaSkill navigation">
        <div class="group"></div>
        <div class="div">
          <div class="logo-mark" aria-hidden="true">
            <svg class="vector" width="51" height="40" viewBox="0 0 51 40">
              <image href="images/loading/Vector-2.svg" width="51" height="40" />
            </svg>
            <svg class="img" width="30" height="30" viewBox="0 0 44 44">
              <image href="images/loading/Vector.svg" width="44" height="44" />
            </svg>
            <svg class="vector-2" width="33" height="32" viewBox="0 0 33 32">
              <image href="images/loading/Vector-1.svg" width="33" height="32" />
            </svg>
          </div>
          <p class="kada-skill" aria-label="KadaSkill">
            <span class="span">Kada</span><span class="text-wrapper-2">Skill</span>
          </p>
        </div>
      </header>
    </main>
    <script>
      const SUPABASE_URL = 'https://kbpbubsnadnhebgdggdy.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImticGJ1YnNuYWRuaGViZ2RnZ2R5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgwMjA4MTksImV4cCI6MjA3MzU5NjgxOX0.4O8ZLeZ2iR786MZ8JS_55nzhn-5WxqabMtDQuAoZkAA';

      const exitAnimationsComplete = waitForExitAnimations();

      function parseTimeToMs(value) {
        const trimmed = (value || '').trim();
        if (!trimmed) return 0;
        if (trimmed.endsWith('ms')) return Number.parseFloat(trimmed);
        if (trimmed.endsWith('s')) return Number.parseFloat(trimmed) * 1000;
        const numeric = Number.parseFloat(trimmed);
        return Number.isNaN(numeric) ? 0 : numeric;
      }

      function waitForAnimation(element, animationName) {
        return new Promise((resolve) => {
          if (!element) {
            resolve();
            return;
          }

          let resolved = false;
          let fallbackId = null;

          const cleanup = () => {
            if (resolved) return;
            resolved = true;
            element.removeEventListener('animationend', onEnd);
            element.removeEventListener('animationcancel', onCancel);
            if (fallbackId !== null) {
              clearTimeout(fallbackId);
            }
            resolve();
          };

          const matchesName = (event) => !animationName || event.animationName === animationName;

          const onEnd = (event) => {
            if (matchesName(event)) {
              cleanup();
            }
          };

          const onCancel = (event) => {
            if (matchesName(event)) {
              cleanup();
            }
          };

          element.addEventListener('animationend', onEnd);
          element.addEventListener('animationcancel', onCancel);

          if (element.getAnimations) {
            const activeAnimation = element
              .getAnimations()
              .find((animation) => animation.animationName === animationName);

            if (activeAnimation) {
              activeAnimation.finished.then(cleanup).catch(cleanup);
            }
          }

          const computed = window.getComputedStyle(element);
          const names = computed.animationName.split(',');
          const delays = computed.animationDelay.split(',');
          const durations = computed.animationDuration.split(',');
          const index = names.findIndex((name) => name.trim() === animationName);

          if (index !== -1) {
            const totalMs = parseTimeToMs(delays[index]) + parseTimeToMs(durations[index]) + 100;
            fallbackId = window.setTimeout(() => cleanup(), totalMs);
          } else {
            fallbackId = window.setTimeout(() => cleanup(), 6000);
          }
        });
      }

      function waitForExitAnimations() {
        const icon = document.querySelector('.icon');
        const text = document.querySelector('.text-wrapper');
        return Promise.all([
          waitForAnimation(icon, 'popZoom'),
          waitForAnimation(text, 'textPopZoom'),
        ]);
      }

      function getGoogleAvatarUrl(user) {
        if (!user || !user.app_metadata || user.app_metadata.provider !== 'google') {
          return null;
        }
        const metadata = user.user_metadata || {};
        if (typeof metadata.avatar_url === 'string' && metadata.avatar_url) {
          return metadata.avatar_url;
        }
        if (typeof metadata.picture === 'string' && metadata.picture) {
          return metadata.picture;
        }
        const identities = Array.isArray(user.identities) ? user.identities : [];
        for (let i = 0; i < identities.length; i++) {
          const identity = identities[i];
          if (identity && identity.provider === 'google' && identity.identity_data) {
            const data = identity.identity_data;
            if (typeof data.avatar_url === 'string' && data.avatar_url) {
              return data.avatar_url;
            }
            if (typeof data.picture === 'string' && data.picture) {
              return data.picture;
            }
          }
        }
        return null;
      }

      async function determineRedirectTarget() {
        try {
          if (!window.supabase || !window.supabase.createClient) {
            console.error('Supabase client library not found. Redirecting to login.');
            return 'index.html';
          }

          const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          const {
            data: { user },
            error: userError,
          } = await supabase.auth.getUser();

          if (userError) {
            console.error('Failed to fetch user session:', userError);
            return 'index.html';
          }

          if (!user) {
            console.error('No user session found. Redirecting to login.');
            return 'index.html';
          }

          const { data: profile, error: profileError } = await supabase
            .from('profiles')
            .select('full_name, total_xp, bio, avatar_url, role')
            .eq('id', user.id)
            .single();

          const googleAvatarUrl = getGoogleAvatarUrl(user);

          if (profileError) {
            console.error('Failed to fetch profile:', profileError);
            if (profileError.code === 'PGRST116') {
              const fallbackProfile = {
                full_name: user.email ? user.email.split('@')[0] : '',
                total_xp: 0,
                bio: '',
                avatar_url: googleAvatarUrl || null,
              };
              sessionStorage.setItem('userProfile', JSON.stringify(fallbackProfile));
              sessionStorage.setItem('authUser', JSON.stringify(user));
              return 'home.html';
            }
            return 'index.html';
          }

          let finalProfile = profile || null;
          if (finalProfile) {
            const resolvedAvatar = finalProfile.avatar_url || googleAvatarUrl || null;
            if (resolvedAvatar && !finalProfile.avatar_url) {
              finalProfile = Object.assign({}, finalProfile, { avatar_url: resolvedAvatar });
            }
          }

          sessionStorage.setItem('userProfile', JSON.stringify(finalProfile));
          sessionStorage.setItem('authUser', JSON.stringify(user));

          // Redirect admin users to admin panel
          if (finalProfile && finalProfile.role === 'admin') {
            return 'admin.html';
          }

          return 'home.html';
        } catch (err) {
          console.error('Unexpected error during loading:', err);
          return 'index.html';
        }
      }

      async function fetchInitialDataAndRedirect() {
        const targetUrl = await determineRedirectTarget();

        try {
          await exitAnimationsComplete;
        } catch (animationError) {
          console.warn('Loading animation did not complete as expected:', animationError);
        }

        window.location.replace(targetUrl);
      }

      fetchInitialDataAndRedirect();
    </script>
  </body>
</html>
