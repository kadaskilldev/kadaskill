<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Learning - KadaSkill</title>
    <link rel="icon" type="image/svg+xml" href="images/loading/favicon.svg">
    <link rel="apple-touch-icon" href="images/loading/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/learning.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Prism.js for code syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
</head>

<body>
    <!-- Navigation Placeholder -->
    <div id="navigation"></div>

    <!-- Course Header -->
    <header class="course-header">
        <div class="container">
            <div class="course-header-content">
                <div class="course-header-left">
                    <a href="learn.html" class="back-link">
                        <i class="fas fa-arrow-left"></i> Back to Courses
                    </a>
                    <h1 class="course-title" id="courseTitle">Loading course...</h1>
                    <p class="course-description" id="courseDescription"></p>
                    <div class="course-meta">
                        <span class="course-meta-item" id="courseDifficulty">
                            <i class="fas fa-signal"></i> <span>Beginner</span>
                        </span>
                        <span class="course-meta-item" id="courseDuration">
                            <i class="fas fa-clock"></i> <span>10 hours</span>
                        </span>
                        <span class="course-meta-item" id="courseXP">
                            <i class="fas fa-star"></i> <span>500 XP</span>
                        </span>
                    </div>
                </div>
                <div class="course-header-right">
                    <div class="course-progress-widget">
                        <div class="progress-circle" id="progressCircle">
                            <svg width="160" height="160">
                <circle cx="80" cy="80" r="70" fill="none" stroke="#e0e0e0" stroke-width="8"></circle>
                <circle cx="80" cy="80" r="70" fill="none" stroke="#ff9500" stroke-width="8"
                        stroke-dasharray="439.823" stroke-dashoffset="439.823"
                        transform="rotate(-90 80 80)" id="progressCircleFill"></circle>
            </svg>
                            <div class="progress-text" id="progressText">0%</div>
                        </div>
                        <p class="progress-label">Course Progress</p>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </header>

    <!-- Main Learning Area -->
    <main class="learning-main">
        <div class="learning-container">
            <!-- Left Sidebar: Lessons List -->
            <aside class="lessons-sidebar">
                <div class="sidebar-header">
                    <h2>Course Content</h2>
                    <button class="collapse-all-btn" id="collapseAllBtn">
                        <i class="fas fa-compress-alt"></i>
                    </button>
                </div>
                <div class="lessons-list" id="lessonsList">
                    <!-- Loading state -->
                    <div class="lessons-loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading lessons...</p>
                    </div>
                </div>
            </aside>

            <!-- Right Content Area -->
            <section class="lesson-content-area">
                <!-- Lesson Header -->
                <div class="lesson-header" id="lessonHeader">
                    <h2 class="lesson-title" id="lessonTitle">Select a lesson to begin</h2>
                    <div class="lesson-actions">
                    </div>
                </div>

                <!-- Lesson Content -->
                <div class="lesson-content" id="lessonContent">
                    <div class="welcome-message">
                        <i class="fas fa-graduation-cap"></i>
                        <h3>Welcome to the Course!</h3>
                        <p>Select a lesson from the sidebar to begin your learning journey.</p>
                    </div>
                </div>

                <!-- Lesson Navigation -->
                <div class="lesson-navigation" id="lessonNavigation" style="display: none;">
                    <button class="btn-nav btn-prev" id="prevLessonBtn">
                        <i class="fas fa-chevron-left"></i> Previous Lesson
                    </button>
                    <button class="btn-nav btn-next" id="nextLessonBtn">
                        Next Lesson <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </section>
        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer"></div>

    <script src="js/script.js"></script>
    <script src="js/learning.js"></script>
</body>

</html>
