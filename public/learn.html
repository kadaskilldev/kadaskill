<!DOCTYPE html>
<html lang="en">
<!-- Learn.html -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn - KadaSkill</title>
    <link rel="icon" type="image/svg+xml" href="images/loading/favicon.svg">
    <link rel="apple-touch-icon" href="images/loading/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/learn.css?v=4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <!-- Navigation Placeholder -->
    <div id="navigation"></div>

    <!-- Main Content -->
    <main class="learn-main-content">
        <div class="learn-container">
            <!-- Hero Section with Profile -->
            <section class="learn-hero-section">
                <div class="profile-greeting">
                    <div class="profile-avatar-large">
                        <img src="images/profile/default-avatar.svg" alt="Learner avatar" class="avatar-img" loading="lazy">
                    </div>
                    <h1 class="greeting-text">Hello there, <span class="highlight-name">Learner!</span></h1>
                </div>

                <div class="streak-badge">
                    <div class="streak-icon">🔥</div>
                    <div class="streak-info">
                        <span class="streak-number">0</span>
                        <span class="streak-label">Streak</span>
                    </div>
                </div>
            </section>

            <!-- My Courses Section -->
            <section class="my-courses-section">
                <div class="section-header">
                    <h2 class="section-title-main">My Courses</h2>
                    <p class="section-description">
                        Welcome to My Courses—your hub for professional, hands-on learning. Each course is designed to build real-world skills you can apply immediately with confidence and curiosity.
                    </p>
                </div>

                <!-- Course Filter Tabs -->
                <div class="course-filter-tabs">
                    <button class="filter-tab-btn active" data-category="all">My Courses</button>
                    <button class="filter-tab-btn" data-category="ai">Artificial Intelligence</button>
                    <button class="filter-tab-btn" data-category="cybersecurity">Cybersecurity</button>
                    <button class="filter-tab-btn" data-category="cloud">Cloud Computing</button>
                </div>

                <!-- Course Count and Search -->
                <div class="courses-controls">
                    <div class="course-count">
                        <span class="count-number" id="course-count">12</span> Courses
                    </div>
                    <div class="course-search-box">
                        <input type="text" placeholder="Search" class="course-search-input" id="course-search">
                        <i class="fas fa-search course-search-icon"></i>
                    </div>
                </div>

                <!-- Courses Grid -->
                <div class="courses-grid" id="courses-grid">
                    <!-- Courses loaded dynamically from database via learn.js -->
                    <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #666;">
                        <i class="fas fa-spinner fa-spin" style="font-size: 48px; margin-bottom: 16px;"></i>
                        <p style="font-size: 18px;">Loading courses...</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer"></div>

    <script src="js/script.js"></script>
    <script src="js/learn.js"></script>
</body>

</html>
