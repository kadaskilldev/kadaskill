<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KadaSkill - Profile</title>
  <link rel="icon" type="image/svg+xml" href="images/loading/favicon.svg" />
  <link rel="apple-touch-icon" href="images/loading/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/profile.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div id="navigation"></div>
  <main class="profile-page" role="main">
    <section class="profile-hero" aria-labelledby="profile-heading">
      <div class="profile-hero__cover">
        <img src="images/profile/profile-cover.png" alt="Profile cover art" class="profile-hero__cover-image" />
      </div>
      <div class="profile-hero__content">
        <div class="profile-hero__avatar">
          <img src="images/profile/default-avatar.svg" alt="Learner avatar" class="profile-hero__avatar-image" />
        </div>
        <div class="profile-hero__details">
          <h1 id="profile-heading" class="profile-hero__name skeleton-text">&nbsp;</h1>
          <p class="profile-hero__handle skeleton-text">&nbsp;</p>
        </div>
      </div>
    </section>

    <section class="profile-bio-pinned" aria-label="Bio and pinned certifications">
      <div class="container profile-bio-pinned__grid">
        <article class="profile-bio-card" aria-label="Bio">
          <h2 class="profile-bio-card__title">Bio</h2>
          <div class="profile-bio-card__body">
            <div class="profile-bio-card__badge">
              <img src="images/profile/Untitled design (18) 1.png" alt="Mythical level badge"
                class="profile-bio-card__badge-image" />
              <div class="profile-bio-card__badge-text">
                <span class="profile-bio-card__badge-label skeleton-text">&nbsp;</span>
                <span class="profile-bio-card__badge-level skeleton-text">&nbsp;</span>
              </div>
            </div>
            <p class="profile-bio-card__copy skeleton-text">&nbsp;</p>
          </div>
        </article>

        <section class="profile-pinned" aria-label="Pinned certifications">
          <header class="profile-pinned__header">
            <h2 class="profile-pinned__title">Pinned</h2>
          </header>
          <div class="profile-pinned__cards">
            <!-- Pinned certifications will be loaded dynamically from Supabase -->
            <div
              style="width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; color: #666;">
              <i class="fas fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 12px;"></i>
              <p style="font-size: 14px; margin: 0;">Loading pinned certifications...</p>
            </div>
          </div>
        </section>
      </div>
    </section>

    <section class="profile-skills-status" aria-label="Skills and status overview">
      <div class="container profile-skills-status__grid">
        <div class="profile-skills-column">
          <article class="profile-skills-card" aria-label="Skills">
            <h2 class="profile-skills-card__title">Skills</h2>
            <div class="profile-skills-card__list" id="profileSkillsList" role="list">
              <!-- Skeleton placeholders shown during loading -->
              <span class="profile-skills-card__chip skeleton-text" role="listitem">&nbsp;</span>
              <span class="profile-skills-card__chip skeleton-text" role="listitem">&nbsp;</span>
              <span class="profile-skills-card__chip skeleton-text" role="listitem">&nbsp;</span>
            </div>
          </article>
          <figure class="profile-skills-illustration" aria-hidden="true">
            <img src="images/profile/icon.png" alt="" class="profile-skills-illustration__image" />
          </figure>
        </div>

        <div class="profile-status-column">
          <section class="profile-status" aria-label="Status">
            <header class="profile-status__header">
              <h2 class="profile-status__title">Status</h2>
            </header>
            <div class="profile-status__cards">
              <article class="profile-status-card" aria-label="Exercises completed">
                <span class="profile-status-card__label">Exercises</span>
                <span class="profile-status-card__value skeleton-text">---</span>
              </article>
              <article class="profile-status-card" aria-label="Total experience points">
                <span class="profile-status-card__label">Total XP</span>
                <span class="profile-status-card__value skeleton-text">---</span>
              </article>
              <article class="profile-status-card" aria-label="Course badges earned">
                <span class="profile-status-card__label">Course Badges</span>
                <span class="profile-status-card__value skeleton-text">---</span>
              </article>
              <article class="profile-status-card" aria-label="Daily streak">
                <span class="profile-status-card__label">Daily Streak</span>
                <span class="profile-status-card__value skeleton-text">---</span>
              </article>
            </div>
          </section>

          <section class="profile-badges" aria-label="Badges">
            <header class="profile-badges__header">
              <h2 class="profile-badges__title">Badges</h2>
              <span class="profile-badges__count" id="badgeCount">0</span>
            </header>
            <div class="profile-badges__grid" id="profileBadgesGrid">
              <!-- Badges will be loaded dynamically -->
              <div class="profile-badges__loading">
                <i class="fas fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 12px;"></i>
                <p style="font-size: 14px; margin: 0;">Loading badges...</p>
              </div>
            </div>
          </section>

          <section class="profile-courses" aria-label="Courses">
            <div class="profile-courses__header">
              <div class="profile-courses__tabs" role="tablist" aria-label="Course categories">
                <button class="profile-courses__tab profile-courses__tab--single is-active" type="button" role="tab"
                  aria-selected="true">Course</button>
              </div>
              <div class="profile-courses__chevrons">
                <img src="images/profile/prev main.svg" alt="Previous"
                  class="profile-courses__chevron profile-courses__chevron--prev is-hidden" role="button" tabindex="0">
                <img src="images/profile/next main.svg" alt="Next"
                  class="profile-courses__chevron profile-courses__chevron--next" role="button" tabindex="0">
              </div>
            </div>
            <div class="profile-courses__viewport">
              <div class="profile-courses__track">
                <div class="profile-courses__grid profile-courses__slide" data-profile-slide-index="0">
                  <!-- Skeleton course cards shown during loading -->
                  <article class="profile-course-card skeleton-loading" aria-label="Loading course">
                    <div class="profile-course-card__background"></div>
                    <div class="profile-course-card__content">
                      <span class="profile-course-card__eyebrow skeleton-text">&nbsp;</span>
                      <h3 class="profile-course-card__title skeleton-text">&nbsp;</h3>
                      <span class="profile-course-card__cta cta-pill skeleton-loading">&nbsp;</span>
                    </div>
                  </article>
                  <article class="profile-course-card skeleton-loading" aria-label="Loading course">
                    <div class="profile-course-card__background"></div>
                    <div class="profile-course-card__content">
                      <span class="profile-course-card__eyebrow skeleton-text">&nbsp;</span>
                      <h3 class="profile-course-card__title skeleton-text">&nbsp;</h3>
                      <span class="profile-course-card__cta cta-pill skeleton-loading">&nbsp;</span>
                    </div>
                  </article>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </section>


  </main>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/script.js"></script>
  <script src="js/badge-awards.js"></script>
  <script src="js/profile.js"></script>
</body>

</html>
