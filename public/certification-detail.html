<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certification Guide - KadaSkill</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/certification-detail.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Navigation Placeholder -->
    <div id="navigation"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Breadcrumb -->
            <nav class="breadcrumb">
                <a href="certification.html" class="breadcrumb-link">
                    <i class="fas fa-arrow-left"></i> Back to Certifications
                </a>
            </nav>

            <!-- Certification Header -->
            <section class="cert-header">
                <div class="cert-header-content">
                    <div class="cert-icon-large" id="cert-icon">
                        <i class="fas fa-certificate"></i>
                    </div>
                    <div class="cert-header-text">
                        <h1 class="cert-title" id="cert-title">Loading...</h1>
                        <p class="cert-subtitle" id="cert-subtitle">Loading...</p>
                        <div class="cert-meta">
                            <span class="cert-badge" id="cert-category">Category</span>
                            <span class="cert-duration"><i class="fas fa-clock"></i> <span id="cert-duration">0</span> hours</span>
                            <span class="cert-level" id="cert-level">Level</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Certification Overview -->
            <section class="cert-section">
                <h2 class="section-title">Overview</h2>
                <p class="section-text" id="cert-description">Loading certification details...</p>
            </section>

            <!-- Prerequisites -->
            <section class="cert-section">
                <h2 class="section-title">Prerequisites</h2>
                <ul class="cert-list" id="prerequisites-list">
                    <li>Loading prerequisites...</li>
                </ul>
            </section>

            <!-- Certification Guide with Links -->
            <section class="cert-section">
                <h2 class="section-title">How to Get This Certification</h2>
                <p class="guide-intro">Follow these steps and resources to prepare for and obtain this certification:</p>
                <div class="guide-steps" id="guide-steps">
                    <!-- Steps will be dynamically loaded -->
                </div>
            </section>
        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer"></div>

    <script src="js/script.js"></script>
</body>
</html>
