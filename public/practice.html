<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice - KadaSkill</title>
    <link rel="icon" type="image/svg+xml" href="images/loading/favicon.svg">
    <link rel="apple-touch-icon" href="images/loading/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/practice.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <!-- Navigation Placeholder -->
    <div id="navigation"></div>

    <!-- Main Content -->
    <main class="practice-main-content">
        <div class="practice-container">
            <!-- Hero Section -->
            <section class="practice-hero-section" id="hero-section">
                <div class="practice-hero-content">
                    <div class="practice-robot">
                        <img src="images/practice-robot.png" alt="Practice Robot" onerror="this.style.display='none';">
                    </div>
                    <div class="practice-hero-text">
                        <h1 class="practice-title">Let's Practice!</h1>
                        <p class="practice-subtitle">Let's test your learnings here.</p>
                    </div>
                </div>
            </section>

            <!-- Filter Section -->
            <section class="practice-filter-section" id="filter-section">
                <div class="filter-container">
                    <button class="filter-btn active" data-category="all">All</button>
                    <button class="filter-btn" data-category="Artificial Intelligence">Artificial Intelligence</button>
                    <button class="filter-btn" data-category="Cybersecurity">Cybersecurity</button>
                    <button class="filter-btn" data-category="Cloud Computing">Cloud Computing</button>
                </div>
            </section>

            <div id="filter-placeholder" style="display: none; height: 80px;"></div>

            <!-- Practice Cards Grid -->
            <section class="practice-cards-section">
                <div class="practice-grid">
                    <!-- Practice exercises loaded dynamically from database via practice.js -->
                    <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #666;">
                        <i class="fas fa-spinner fa-spin" style="font-size: 48px; margin-bottom: 16px;"></i>
                        <p style="font-size: 18px;">Loading practice exercises...</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer"></div>

    <script src="js/script.js"></script>
    <script src="js/practice.js"></script>
</body>

</html>
